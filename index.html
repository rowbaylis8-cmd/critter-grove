<html lang="en"><head><meta charset="utf-8">

<title>Critter Grove</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none;background:#1f2a33;color:#f2efe8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button,select{font:inherit;touch-action:manipulation;min-height:44px;border:0;border-radius:12px;padding:10px 14px;background:#3c5566;color:#fff;font-weight:600}
button:active{filter:brightness(1.25);transform:scale(.97)}button:disabled{opacity:.4}
button.pri{background:linear-gradient(#e2a43a,#c9822a);color:#231507}button.dng{background:#8a3a34}button.ghost{background:#ffffff1a}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 10px) 12px 16px}
.view.on{display:block}#v-map{padding:0;overflow:hidden;touch-action:none}
nav{display:flex;background:#141c22;border-top:1px solid #ffffff14;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;min-height:58px;font-size:11px;color:#9fb0ba;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}nav button.on{color:#f0c060}
h2{margin:4px 0 10px;font-size:20px}h3{margin:14px 0 8px;font-size:15px;color:#cfd8dc}
.card{background:#2a3843;border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.row>.grow{flex:1;min-width:0}.muted{color:#9fb0ba;font-size:12px}
.bar{height:8px;background:#0f161b;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#6fd0a0,#e2d36a);width:0;transition:width .55s ease-out}
.bar.hp>i{background:linear-gradient(90deg,#d0503c,#e2b04a,#6fd06a)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{min-height:44px;padding:8px 12px;border-radius:22px;background:#3c5566;font-size:13px}.chip.on{background:#e2a43a;color:#231507}
.type{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.mon{background:#2a3843;border-radius:14px;padding:6px;text-align:center;font-size:12px;position:relative;min-height:44px}
.mon .badge{position:absolute;top:4px;left:4px;font-size:10px;background:#e2a43a;color:#231507;border-radius:6px;padding:0 4px;font-weight:700}
.mon.unk svg{filter:brightness(0) opacity(.35)}
.r-common{color:#b9c4a8}.r-uncommon{color:#7fd39a}.r-rare{color:#78b4f0}.r-epic{color:#c890f0}.r-legendary{color:#f0c060}
/* map */
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}.pill{background:#141c22d9;border-radius:14px;padding:6px 10px;font-size:13px;backdrop-filter:blur(4px)}
#buddyPortrait{width:52px;height:52px;border-radius:50%;background:#141c22d9;overflow:hidden;border:2px solid #e2a43a;flex:none}
#buddyPortrait svg{width:60px;height:52px;margin-left:-4px}
.side{position:absolute;right:10px;bottom:16px;display:flex;flex-direction:column;gap:10px}
.side button{width:52px;height:52px;border-radius:50%;padding:0;background:#141c22e0;font-size:20px}
#joy{position:absolute;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff30;touch-action:none;display:none}
#joy i{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#ffffffaa}
#banner{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 70px);text-align:center;pointer-events:none}
#banner span{display:inline-block;margin:2px;background:#141c22d9;border-radius:12px;padding:4px 10px;font-size:12px}
/* sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:86%;background:#1f2a33;border-radius:20px 20px 0 0;z-index:46;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 30px #0008}
.sheet.on{transform:none}.sheet .x{position:sticky;top:0;float:right;width:44px;height:44px;padding:0;border-radius:50%;z-index:2}
#scrim{position:fixed;inset:0;background:#0007;z-index:44;display:none;touch-action:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%);z-index:60;background:#141c22f2;border:1px solid #ffffff22;border-radius:16px;padding:10px 16px;font-size:14px;max-width:88vw;text-align:center;display:none;pointer-events:none}
/* encounter */
#enc{position:fixed;inset:0;z-index:40;display:none;touch-action:none;overflow:hidden;max-width:480px;margin:0 auto}
#enc.on{display:block}#encBg{position:absolute;inset:0}
#encTop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;text-align:center}
#encMon{position:absolute;width:220px;height:187px;left:0;top:0;will-change:transform}
#ring{position:absolute;border-radius:50%;border:4px solid #7fe07a;pointer-events:none;box-shadow:0 0 8px #0006}
#ringOuter{position:absolute;border-radius:50%;border:2px solid #ffffffaa;pointer-events:none}
#ball{position:absolute;width:62px;height:62px;left:0;top:0;touch-action:none;will-change:transform}
#ball svg{width:100%;height:100%}
#encBottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:space-between;align-items:flex-end}
#encBottom button{font-size:13px;padding:8px 10px}
#throwTxt{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .2s}
#battle{position:absolute;left:0;right:0;bottom:0;background:#141c22f2;border-radius:18px 18px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:none}
.shake{animation:shake .45s ease-in-out}@keyframes shake{25%{transform:rotate(-24deg)}75%{transform:rotate(24deg)}}
/* creature art animation */
.cr .br{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.cr .tl{transform-box:fill-box;animation:sway 2.8s ease-in-out infinite}
.cr .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.cr .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.cr .wg{transform-box:fill-box;transform-origin:100% 50%;animation:flap 2.2s ease-in-out infinite}
.cr .fx{animation:glow 2.6s ease-in-out infinite}
.cr .hv{animation:hover 3.6s ease-in-out infinite}
.lite *{animation:none!important}
@keyframes breathe{50%{transform:scale(1.012,1.025)}}@keyframes sway{50%{transform:rotate(5deg)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes flick{to{transform:scaleY(1.12) skewX(3deg)}}@keyframes flap{50%{transform:scaleX(.9)}}@keyframes glow{50%{opacity:.55}}@keyframes hover{50%{transform:translateY(-5px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.xpfly{position:fixed;z-index:55;font-weight:800;color:#e2d36a;pointer-events:none;animation:xpup 1.1s forwards;text-shadow:0 1px 3px #000}@keyframes xpup{to{transform:translateY(-50px);opacity:0}}
#hatch{position:fixed;inset:0;z-index:45;background:radial-gradient(#2f4250,#11181d);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#hatch.on{display:flex}.eggw{animation:eggw .5s ease-in-out infinite}@keyframes eggw{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.stat{display:grid;grid-template-columns:38px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:3px 0}

/* realism pass */
.cr:not(.lite){filter:drop-shadow(0 8px 6px #0005) drop-shadow(0 0 1px #0003)}
#encMon>svg{animation:encbob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes encbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(.985,1.02)}}
#encMon.rareglow::before{content:"";position:absolute;left:10%;right:10%;top:15%;bottom:5%;border-radius:50%;background:radial-gradient(#fff4b0aa,#ffd34a33 45%,transparent 70%);animation:glow 1.8s ease-in-out infinite;pointer-events:none}
#ballSh{position:absolute;left:0;top:0;width:44px;height:12px;border-radius:50%;background:radial-gradient(#0008,transparent 70%);pointer-events:none;opacity:0;will-change:transform}
#todTint{position:absolute;inset:0;pointer-events:none;transition:background 2s;z-index:1}
#encTint{position:absolute;inset:0;pointer-events:none}
.hflash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fff,#fff8 30%,transparent 70%);animation:hflash .9s ease-out forwards;z-index:47}@keyframes hflash{from{opacity:1}to{opacity:0}}
#hEgg svg{filter:drop-shadow(0 0 14px #fff6) drop-shadow(0 10px 8px #0006)}
.eggw.fast{animation-duration:.22s}
.mon{transition:transform .12s}.mon:active{transform:scale(.96)}
#muteBtn{position:fixed;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:43;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;background:#141c22cc;border:1px solid #ffffff22}
@media (prefers-reduced-motion:reduce){#encMon>svg,.eggw{animation:none}}

 SHOP.forEach(function(g){h+='<h3>'+g[0]+'</h3>';g[1].forEach(function(it,i){if(it[0]==="e:festive"&&S.set.season==="off")return;var p=price(it[2]);h+='<div class="card row"><div class="grow"><b>'+itemName(it[0])+'</b> ×'+it[1]+(it[0].indexOf("e:")===0?'<div class="muted">'+EGGS[it[0].slice(2)].km+' km egg</div>':'')+'</div><button data-buy="'+it[0]+'|'+it[1]+'|'+it[2]+'"'+(S.coins>=p?"":" disabled")+'>🪙 '+p+'</button></div>'})});
 h+='<h3>Upgrades</h3>'+UP.map(function(u){var mx=S.up[u.k]>=u.max,c=Math.floor(u.base*Math.pow(u.g,S.up[u.k]));return '<div class="card row"><div class="grow"><b>'+u.n+'</b> ('+S.up[u.k]+'/'+u.max+')<div class="muted">'+u.d+'</div></div><button data-up="'+u.k+'"'+(mx||S.coins<c?" disabled":"")+'>'+(mx?"MAX":"🪙 "+fmt(c))+'</button></div>'}).join("");
 h+='<h3>Premium</h3><div class="card"><div class="row"><span style="width:44px;height:44px">'+ballSvg("crown")+'</span><div class="grow"><b>3× '+NAMES.balls.crown+'</b><div class="muted">Always catches.</div></div></div><button class="pri" id="buyPack" style="width:100%;margin-top:8px">'+NAMES.masterPack+packPrice()+'</button>'+(nativeShop()?'':'<p class="muted">Web build: this runs a clearly-labelled TEST purchase (no charge) so you can playtest. Real billing is only in the Android app.</p>')+'</div>';

  if(k.indexOf("e:")===0){if(S.eggs.length>=9){toast("Egg storage full (9)");return}S.eggs.push({k:k.slice(2),km:0,start:Date.now()})}else if(k.indexOf("b:")===0)S.berries[k.slice(2)]+=n;else if(k.indexOf("x:")===0)S.xpi[k.slice(2)]+=n;else S.balls[k]+=n;

/* single purchase hook: Android build replaces the body with real billing */
/* ===== Google Play Billing (cordova-plugin-purchase via Capacitor) ===== */
var PLAY_PRODUCT_ID="crown_orb_pack",billingReady=false;
function isNativeApp(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.CdvPurchase&&window.CdvPurchase.store)}
var billingStarted=false;
function initBilling(){if(billingStarted)return;try{if(!isNativeApp())return;billingStarted=true;var P=window.CdvPurchase,st=P.store;
 st.register([{id:PLAY_PRODUCT_ID,type:P.ProductType.CONSUMABLE,platform:P.Platform.GOOGLE_PLAY}]);
 st.when().approved(function(t){t.verify()}).verified(function(r){r.finish()}).finished(function(t){
  var ok=(t.products||[]).some(function(p){return p.id===PLAY_PRODUCT_ID});if(ok&&window.onMasterPackPurchased)window.onMasterPackPurchased()});
 st.error(function(e){if(e&&e.code!==P.ErrorCode.PAYMENT_CANCELLED)toast("Store error: "+(e.message||e.code))});
 Promise.resolve(st.initialize([P.Platform.GOOGLE_PLAY])).then(function(){billingReady=true;if(typeof tab!=="undefined"&&tab==="shop")renderShop()}).catch(function(e){billingStarted=false;console.log("billing unavailable",e)});
}catch(e){billingStarted=false;console.log("billing init failed",e)}}
/* lazy: billing starts only when the shop is opened or a purchase is tapped, never at app launch */
function safeInitBilling(){try{initBilling()}catch(e){}}
function purchaseMasterPack(){
 safeInitBilling();
 if(isNativeApp()){var st=window.CdvPurchase.store,pr=st.get(PLAY_PRODUCT_ID,window.CdvPurchase.Platform.GOOGLE_PLAY),o=pr&&pr.getOffer();
  if(!billingReady||!o){toast("Store not ready yet — check your connection and try again");return}
  st.order(o).then(function(err){if(err&&err.code!==window.CdvPurchase.ErrorCode.PAYMENT_CANCELLED)toast("Purchase failed: "+(err.message||err.code))});return}
 S.balls.crown+=3;save();toast("🧪 TEST PURCHASE (no charge): +3 "+NAMES.balls.crown+"s granted.<br>Real billing is only in the Android app.",3500);if(tab==="shop")renderShop()}
window.onMasterPackPurchased=function(){S.balls.crown+=3;save();toast("+3 "+NAMES.balls.crown+"s");if(tab==="shop")renderShop()};
function nativeShop(){return typeof isNativeApp==="function"&&isNativeApp()}
function packPrice(){try{if(nativeShop()){var p=window.CdvPurchase.store.get(PLAY_PRODUCT_ID,window.CdvPurchase.Platform.GOOGLE_PLAY);if(p&&p.pricing&&p.pricing.price)return " – "+p.pricing.price}}catch(e){}return ""}

 '<div class="card"><b>Seasonal creatures</b><div class="chips" style="margin-top:6px">'+[["always","Always on"],["auto","Auto"],["off","Off"]].map(function(s){return '<button class="chip'+(S.set.season===s[0]?" on":"")+'" data-se="'+s[0]+'">'+s[1]+'</button>'}).join("")+'</div><div class="muted">Always on: low rate all year, boosted in season (Dec 🎄, Oct 🎃, Mar–Apr 🌸). Auto: only in season.</div></div>'+
